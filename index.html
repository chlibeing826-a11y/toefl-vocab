<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEFL Vocabulary Study</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Fixed Left Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="sidebar-logo-icon">📚</span>
          <span class="sidebar-logo-text">TOEFL词汇</span>
        </div>
        <div class="sidebar-streak" id="sidebar-streak" title="学习连续天数"></div>
      </div>

      <div class="sidebar-nav">
        <button class="nav-btn" data-view="dashboard">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">今日概况</span>
        </button>
        <button class="nav-btn" data-view="wordlist">
          <span class="nav-icon">📖</span>
          <span class="nav-text">单词列表</span>
        </button>
        <button class="nav-btn" data-view="review">
          <span class="nav-icon">🔄</span>
          <span class="nav-text">开始复习</span>
        </button>
        <button class="nav-btn" data-view="story">
          <span class="nav-icon">✍️</span>
          <span class="nav-text">生成短文</span>
        </button>
        <button class="nav-btn" data-view="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">设置</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-version">v1.0.0</div>
      </div>
    </nav>

    <!-- Scrollable Main Content -->
    <main class="main-content" id="main-content">
      <div id="view-container">
        <!-- Views rendered here by app.js -->
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <p>加载中...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box">
      <button class="modal-close" id="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
